name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Orders.slnx
      - run: dotnet build Orders.slnx --no-restore -c Release
      - run: dotnet test Orders.slnx --no-build -c Release --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results
          path: tests/**/TestResults/*.trx

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mc1-orders:ci .
      - name: Smoke test
        run: |
          docker run -d --name orders -p 8080:8080 mc1-orders:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/health/ready; then break; fi
            sleep 2
          done
          curl -fs "http://localhost:8080/api/v1/orders?pageSize=1" | grep -q '"totalItems":10000'
          curl -fs http://localhost:8080/ | grep -q '<div id="root">'
      - if: always()
        run: docker rm -f orders
